
<!DOCTYPE html>
<html>
<head>
    <title>My Digital Zoo Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1>My Digital Zoo Manager</h1>
        <h3>Introduction to HTML DOM</h3>
        <p>Welcome to my digital zoo! Explore the different animal zones.</p>

        <div id="zoo" class="card">
            <div class="card-body">
                <h2>My Zoo Animals</h2>
                <div class="animal-zone">
                    <h4>Forest Zone</h4>
                    <p id="lion">Lion</p>
                    <p id="monkey">Monkey</p>
                </div>

                <div class="animal-zone">
                    <h4>Ocean Zone</h4>
                    <p id="dolphin">Dolphin</p>
                    <p id="shark">Shark</p>
                </div>

                <div class="animal-zone">
                    <h4>Desert Zone</h4>
                    <p id="camel">Camel</p>
                    <p id="snake">Snake</p>
                </div>
            </div>
        </div>

        <button class="btn btn-primary mt-3" onclick="exploreZoo()">
            Explore Zoo
        </button>

        <button class="btn btn-success mt-3" onclick="changeZoo()">
            Change Zoo Style
        </button>

        <div class="card mt-3">
            <div class="card-body">
                <h3>Zoo Information</h3>
                <p id="result">Click Explore Zoo to see information.</p>
            </div>
        </div>
    </div>

    <script>
        function exploreZoo() {
            var zoo = document.getElementById("zoo");
            var parent = document.getElementById("lion").parentNode;
            var children = zoo.children;
            var sibling = document.getElementById("lion").nextElementSibling;
            var type = zoo.nodeType;

            document.getElementById("result").innerHTML =
                "Parent: " + parent.tagName + "<br>" +
                "Number of zoo children: " + children.length + "<br>" +
                "Sibling of Lion: " + sibling.textContent + "<br>" +
                "Zoo Node Type: " + type;
        }

        function changeZoo() {
            document.getElementById("zoo").style.backgroundColor = "#d1f7d6";
            document.getElementById("lion").style.color = "red";
            document.getElementById("monkey").style.color = "blue";
            document.getElementById("result").innerHTML =
                "Zoo style has been changed successfully!";
        }
    </script>
    <footer>
        <p>© 2026 My Digital Zoo Manager</p>
    </footer>

</body>
</html>
